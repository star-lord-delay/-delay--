<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
        <title>安心通学ナビ</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

<!--ヘッダー-->
        <header class="header">
            <div class="header__content">
                <div class="header__title-group">
                    <h1 class="header__title">安心通学</h1>
                    <div class="header__tag" id="header-Tag">delay-0</div>
                </div>
            </div>
        </header>

<!--メインコンテンツ-->
        <main class="main__content">

<!--駅登録-->
            <div class="station">
                <label for="stationSelect" class="station__setting">利用駅を登録</label>
                <div class="station__wrapper">
                    <select id =stationSelect class="station__select">
                        <option value="">駅を選択してください</option>
                    </select>
                </div>
            </div>

<!--プラン-->
            <div class="plan">
                <div class="plan__header">
                    <p class="plan__title">あなたの通学プラン</p>
                    <span class="plan__station" id="userStationName">取得中</span>
                </div>
<!--遅延時-->
                <div class="plan__alert" id="alertBanner" style="display: none;">
                    <span class="plan__alert-text" id="alert-Text">遅延情報を計算中</span>
                </div>

<!--推奨プラン-->
                <div class ="plan__recommend">
<!--電車の情報-->
                    <div class="plan__recommend-left">
                        <div class="plan__recommend-label" id="recStatusLabel">計算中...</div>
                        <div class="plan__recommend-time" id="recTrainTime">--:--</div>
                        <div class="plan__recommend-station" id="recStationName">取得中...</div>
                    </div>
<!--スクーバス時刻-->
                    <div class="plan__recommend-right">
                        <div class="plan__recommend-label">利用するバス</div>
                        <div class="plan__recommend-bustime" id="recBusTime">--:--発</div>
                    </div>
                </div>
            </div>
<!--候補-->
            <div class="candidate">
                <div class="candidate__header">
                    <h3 class="candidate__title">どの電車なら間に合う</h3>
                    <p class="candidate__station">利用駅:<span id="candidateStation">取得中</span></p>
                </div>
<!-- JSが計算結果（時刻表のリスト）を流し込む空箱 -->
                <div class="candidate__list" id="candidateList">
                    <p class="candidate__loading">最新のダイヤと遅延情報を計算中...</p>
                </div>
            </div>
        </main>
<!--ナビゲーション-->
        <nav class="bottom__nav">
            <a href="#" class="nav__item active">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>ホーム</span>
            </a>
            <a href="#" class="nav__item">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <span>検索</span>
            </a>
            <a href="#" class="nav__item">
                <div class="nav-icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
                    <span class="nav-badge"></span>
                </div>
                    <span>お知らせ</span>
            </a>
            <a href="#" class="nav__item">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <span>マイページ</span>
            </a>
        </nav>

<!--JavaScriptを読み込む-->
        <script src="app.js"></script>
    </body>
</html>
